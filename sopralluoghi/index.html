<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sopralluoghi MASFOR</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#22428a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sopralluoghi">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
/* VOICE work tool for field use: calm, dense, big touch targets
   IDEA the MASFOR paper questionnaires (QVRB, QCA) turned into a tablet form that prints back to the same sheet as a PDF
   PICTURE the form itself, one section at a time, with a rail that shows how much of each section is filled
   COLOUR white ground, ink #14202e, MASFOR blue #22428a with teal #106888 from the logo; green, amber, red only for states
   TYPE system sans (offline: no web fonts)
   LAYOUT tablet landscape: rail 230px + form column; portrait and phone: section chips under the top bar, one column */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0f1620);--ink:light-dark(#14202e,#e6edf5);--mut:light-dark(#566577,#9babbd);--line:light-dark(#d3dbe6,#2b3a4b);--blue:light-dark(#22428a,#8fb0f0);--teal:light-dark(#106888,#5fb7d4);--on:light-dark(#ffffff,#0f1620);--bar:light-dark(#e3ebf7,#18273b);--panel:light-dark(#f5f8fc,#141f2d);--ok:light-dark(#1b7a45,#62d293);--warn:light-dark(#a96500,#f2b04c);--bad:light-dark(#b8322a,#f3857c);--neu:light-dark(#66717f,#8d99a8)}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;overflow-x:clip;-webkit-text-size-adjust:100%;padding-bottom:env(safe-area-inset-bottom)}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid color-mix(in srgb,var(--blue) 60%,transparent);outline-offset:2px}
[hidden]{display:none!important}
.ban{background:color-mix(in srgb,var(--warn) 16%,var(--bg));border-bottom:1px solid var(--line);padding:8px max(3vw,16px);font-size:15px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:8px max(3vw,16px);padding-top:max(8px,env(safe-area-inset-top));min-height:60px}
.brand{display:flex;align-items:center;gap:12px;flex:1}
.brand img{height:34px;width:auto;display:block;background:#fff;border-radius:6px;padding:3px 6px}
.brand span{color:var(--mut);font-weight:600}
.tt{flex:1;display:flex;align-items:center;gap:10px;overflow:hidden}
.tt b{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--panel)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:var(--on)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:var(--on)}
.btn.ghost{border-color:transparent;background:none}
.btn.sm{min-height:40px;padding:0 12px;font-size:15px}
.btn.ic{width:44px;padding:0;font-size:22px}
.st{display:flex;align-items:center;gap:7px;color:var(--mut);font-size:14px;white-space:nowrap}
.st i{width:9px;height:9px;border-radius:50%;background:var(--neu);flex:none}
.st.ok i{background:var(--ok)}
.st.wait i{background:var(--warn)}
.st.err i{background:var(--bad)}
.tag{font-size:13px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--bar);color:var(--blue);white-space:nowrap}
.tag.done{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.tag.ex{background:var(--panel);color:var(--mut);border:1px solid var(--line)}
.lv{max-width:1040px;margin:0 auto;padding:clamp(24px,4vw,48px) max(3vw,16px) 80px}
.lh{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
h1{font-size:clamp(32px,4.5vw,46px);line-height:1.05;letter-spacing:-.02em;margin:0;text-wrap:balance}
.sub{color:var(--mut);margin:8px 0 0}
.flt{display:flex;gap:8px;flex-wrap:wrap;margin:28px 0 6px;align-items:center}
.flt input{flex:1 1 240px;max-width:340px}
.rec{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 20px;width:100%;text-align:left;padding:16px 8px;border:0;border-bottom:1px solid var(--line);background:none;cursor:pointer;align-items:center}
.rec:hover{background:var(--panel)}
.rec .nm{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.rec .nm b{font-size:19px}
.rec .m{color:var(--mut);font-size:15px;grid-column:1}
.rec .r{display:flex;align-items:center;gap:12px;grid-row:1/3;grid-column:2}
.bar{width:96px;height:6px;background:var(--line);border-radius:3px;overflow:hidden;display:block}
.bar i{display:block;height:100%;background:var(--blue)}
.pc{font-size:14px;color:var(--mut);font-variant-numeric:tabular-nums;white-space:nowrap}
.empty{color:var(--mut);padding:24px 0}
.foot{color:var(--mut);font-size:14px;margin-top:28px;max-width:72ch}
.ed{display:grid;grid-template-columns:230px minmax(0,1fr);gap:clamp(20px,3vw,40px);max-width:1180px;margin:0 auto;padding:20px max(3vw,16px) 96px}
.rail{position:sticky;top:76px;align-self:start;display:flex;flex-direction:column;gap:2px;max-height:calc(100svh - 96px);overflow:auto}
.rail button{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 8px;text-align:left;padding:8px 10px;border:0;border-radius:8px;background:none;cursor:pointer;min-height:44px;align-items:center}
.rail button:hover{background:var(--panel)}
.rail button.cur{background:var(--bar)}
.rail .nm{font-weight:600;line-height:1.2}
.rail .mb{grid-column:1/-1;height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.rail .mb i{display:block;height:100%;background:var(--blue)}
.rail .full .mb i{background:var(--ok)}
.main{max-width:780px}
.sec{animation:in .18s ease-out}
@keyframes in{from{opacity:0;transform:translateY(4px)}}
.sh{background:var(--bar);padding:14px 18px;border-radius:10px;display:flex;justify-content:space-between;align-items:baseline;gap:6px 16px;flex-wrap:wrap;margin-bottom:6px}
.sh h2{margin:0;font-size:clamp(26px,3vw,34px);line-height:1.08;letter-spacing:-.015em}
.sh span{color:var(--mut);font-variant-numeric:tabular-nums}
h3.h{font-size:19px;margin:26px 0 2px;line-height:1.2}
h3.h span{display:block;font-size:15px;font-weight:400;color:var(--mut);margin-top:2px}
.fld{display:flex;flex-direction:column;gap:6px;padding:10px 0}
.lab{font-weight:600}
.req{color:var(--bad)}
.hint{color:var(--mut);font-size:15px}
input[type=text],input[type=tel],input[type=email],input[type=number],input[type=date],input[type=search],textarea,select{min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:16px;width:100%}
textarea{resize:vertical;line-height:1.45}
input:focus,textarea:focus,select:focus{border-color:var(--blue)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(250px,100%),1fr));gap:0 20px}
.grid2>.full,.grid2>.row,.grid2>.rep{grid-column:1/-1}
.row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;padding:10px 0;border-bottom:1px solid var(--line)}
.row .q{flex:1 1 280px;line-height:1.35}
.row .nt{flex:1 1 100%}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{min-height:44px;min-width:58px;padding:0 14px;border:1px solid var(--line);border-radius:8px;background:var(--bg);cursor:pointer;font-weight:600}
.opt:hover{border-color:var(--blue)}
.opt.on{background:var(--blue);border-color:var(--blue);color:var(--on)}
.opt.c0.on{background:var(--ok);border-color:var(--ok)}
.opt.c1.on{background:var(--bad);border-color:var(--bad)}
.opt.c2.on{background:var(--warn);border-color:var(--warn)}
.opt.c3.on{background:var(--neu);border-color:var(--neu)}
.st4{display:grid;grid-template-columns:minmax(0,1fr) 170px;gap:8px 16px;align-items:end;padding:12px 0;border-bottom:1px solid var(--line)}
.st4 .q{align-self:center}
.st4 .opts{grid-column:1/-1}
.mini{display:flex;flex-direction:column;gap:3px;font-size:14px;color:var(--mut);font-weight:600}
.mini input{color:var(--ink);font-weight:400}
.pp{display:grid;grid-template-columns:minmax(0,1fr) 180px;gap:10px;align-items:end}
.prow{display:grid;grid-template-columns:minmax(0,1fr) 170px 44px;gap:10px;align-items:end;margin:4px 0 8px}
.conta{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.rep{padding:10px 0}
.item{border:1px solid var(--line);border-radius:10px;padding:4px 16px 12px;margin:10px 0;background:var(--panel)}
.ih{display:flex;justify-content:space-between;align-items:center;font-weight:700;padding:4px 0}
.item input,.item textarea,.item select,.item .opt{background:var(--bg)}
.item .opt.on{background:var(--blue)}
.item .opt.c1.on{background:var(--bad)}.item .opt.c2.on{background:var(--warn)}.item .opt.c3.on{background:var(--neu)}
.ph{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ph figure{margin:0;position:relative;width:104px;height:104px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--panel)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph figure button{position:absolute;top:4px;right:4px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(10,15,20,.68);color:#fff;font-size:20px;cursor:pointer;line-height:1}
.ph .wait{display:grid;place-items:center;color:var(--mut);font-size:14px}
.upl{position:relative;overflow:hidden}
.upl input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.firma{position:relative;border:1px dashed var(--line);border-radius:10px;overflow:hidden;background:#fff;max-width:520px}
.firma canvas{display:block;width:100%;height:170px;touch-action:none;cursor:crosshair}
.fhint{position:absolute;inset:auto 0 12px 0;text-align:center;color:#8a96a5;pointer-events:none;font-size:15px}
.fin{margin-top:28px;padding:18px;border:1px solid var(--line);border-radius:10px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.fin p{margin:0;max-width:50ch}
.fin div{display:flex;gap:8px;flex-wrap:wrap}
.pn{display:flex;justify-content:space-between;gap:12px;margin-top:28px;flex-wrap:wrap}
.ov{position:fixed;inset:0;background:rgba(10,20,30,.45);display:grid;place-items:center;z-index:50;padding:16px}
.md{background:var(--bg);border:1px solid var(--line);border-radius:14px;max-width:560px;width:100%;padding:24px;max-height:90svh;overflow:auto}
.md h2{margin:0 0 12px;font-size:26px;line-height:1.1}
.md textarea{min-height:300px;font-size:14px}
.md .col{display:flex;flex-direction:column;gap:8px;margin:16px 0}
.choice{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--bg);margin:8px 0;cursor:pointer;min-height:44px}
.choice b{font-size:18px}
.choice span{color:var(--mut)}
.choice.on{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue);background:var(--panel)}
.ov2{position:fixed;inset:0;z-index:40}
.menu{position:absolute;right:max(3vw,16px);top:58px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:6px;display:flex;flex-direction:column;min-width:260px}
.menu button,.menu label{text-align:left;min-height:44px;padding:0 12px;border:0;background:none;border-radius:6px;cursor:pointer;font-weight:600;display:flex;align-items:center;position:relative}
.menu button:hover,.menu label:hover{background:var(--panel)}
.menu label input{position:absolute;opacity:0;width:1px;height:1px}
.menu .danger{color:var(--bad)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;display:flex;gap:14px;align-items:center;z-index:60;max-width:calc(100% - 32px)}
.toast button{background:none;border:0;color:inherit;font-weight:700;text-decoration:underline;min-height:36px;cursor:pointer;padding:0 4px}
@media(max-width:860px){.ed{grid-template-columns:minmax(0,1fr);padding-top:0}.rail{position:sticky;top:60px;z-index:10;flex-direction:row;overflow-x:auto;max-height:none;background:var(--bg);margin:0 calc(-1*max(3vw,16px));padding:8px max(3vw,16px);border-bottom:1px solid var(--line)}.rail button{flex:none;grid-template-columns:auto auto}.rail .mb{display:none}.main{max-width:none}}
@media(max-width:600px){.top .st span{display:none}.rec{grid-template-columns:minmax(0,1fr)}.rec .r{grid-row:auto;grid-column:1;margin-top:6px}.prow{grid-template-columns:minmax(0,1fr) 44px}.prow .mini:nth-child(2){grid-column:1;grid-row:2}.pp{grid-template-columns:minmax(0,1fr)}.st4{grid-template-columns:minmax(0,1fr)}.brand span{display:none}.top .pdfb{padding:0 12px}}
@media(max-width:480px){.tt .tag{display:none}.top{gap:8px}.top .btn.ghost{padding:0 8px}}
@media(prefers-reduced-motion:reduce){.sec{animation:none}}
</style>
</head>
<body>
<div id="ban" class="ban" hidden></div>
<header class="top" id="top"></header>
<div id="app"><div class="lv"><p class="empty">Avvio…</p></div></div>
<div id="layer"></div>
<div id="toast" class="toast" role="status" hidden></div>
<script src="vendor/jspdf.umd.min.js"></script>
<script src="vendor/jspdf.plugin.autotable.min.js"></script>

const gp=(o,p)=>p.split('.').reduce((a,k)=>a==null?undefined:a[k],o);
function sp(o,p,v){const ks=p.split('.');let a=o;for(let i=0;i<ks.length-1;i++){const k=ks[i];if(a[k]==null||typeof a[k]!=='object')a[k]=/^\d+$/.test(ks[i+1])?[]:{};a=a[k]}const l=ks[ks.length-1];if(v===undefined||v==='')delete a[l];else a[l]=v}
const dIt=s=>/^\d{4}-\d{2}-\d{2}$/.test(s||'')?s.slice(8,10)+'/'+s.slice(5,7)+'/'+s.slice(0,4):(s||'');
const clone=o=>JSON.parse(JSON.stringify(o));

const today=()=>{const t=new Date();return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0')};
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2,10);
const visible=(f,sc)=>!f.if||(f.if[1]==='*'?sc[f.if[0]]!=null&&sc[f.if[0]]!=='':sc[f.if[0]]===f.if[1]);

const IDB={db:null,
 open(){return new Promise((res,rej)=>{if(!('indexedDB' in window))return rej(new Error('IndexedDB assente'));const r=indexedDB.open('sopralluoghi-masfor',1);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('questionari'))d.createObjectStore('questionari',{keyPath:'id'});if(!d.objectStoreNames.contains('foto'))d.createObjectStore('foto',{keyPath:'id'})};r.onsuccess=()=>{IDB.db=r.result;res()};r.onerror=()=>rej(r.error)})},
 run(store,mode,fn){return new Promise((res,rej)=>{const t=IDB.db.transaction(store,mode),s=t.objectStore(store);let out;const q=fn(s);if(q)q.onsuccess=()=>{out=q.result};t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})},
 all(s){return IDB.run(s,'readonly',o=>o.getAll())},
 get(s,id){return IDB.run(s,'readonly',o=>o.get(id))},
 put(s,v){return IDB.run(s,'readwrite',o=>o.put(v))},
 del(s,id){return IDB.run(s,'readwrite',o=>o.delete(id))}};

function filled(f,v){if(v==null||v==='')return false;if(Array.isArray(v))return v.length>0;if(f.type==='persona')return !!v.nome;if(f.type==='stato')return !!v.v;if(f.type==='conta')return Object.values(v).some(x=>x!==''&&x!=null);return true}
function counted(s,d){let t=0,n=0;for(const f of s.f){if(f.type==='h'||f.type==='foto'||f.opt||!visible(f,d))continue;t++;if(filled(f,d[f.k]))n++}return[n,t]}
function nItems(s,d){let c=0;for(const f of s.f)if(f.type==='rep'&&Array.isArray(d[f.k]))c+=d[f.k].length;return c}
const pcTxt=(s,d,n,t)=>t?n+'/'+t:(nItems(s,d)?String(nItems(s,d)):'—');
function pct(r){let n=0,t=0;for(const s of MOD[r.tipo].sez){const[a,b]=counted(s,r.d||{});n+=a;t+=b}return t?Math.round(n/t*100):0}

/* ---------- testo e JSON leggibili ---------- */
function fmt(f,v){switch(f.type){
 case 'persona':return v&&v.nome?v.nome+(v.data?' (ultimo corso '+dIt(v.data)+')':''):'';
 case 'persone':return(v||[]).filter(x=>x&&x.nome).map(x=>x.nome+(x.data?' (ultimo corso '+dIt(x.data)+')':'')).join('; ');
 case 'checks':return(v||[]).join(', ');
 case 'foto':return v&&v.length?v.length+' foto':'';
 case 'firma':return v?'firmato':'';
 case 'conta':return v?Object.entries(v).filter(([,x])=>x!==''&&x!=null).map(([k,x])=>(k==='co2'?'CO2':cap(k))+': '+x).join(', '):'';
 case 'stato':return v&&v.v?v.v+(v.scad?', scadenza '+dIt(v.scad):''):'';
 case 'date':return v?dIt(v):'';
 default:return v==null?'':String(v)}}
function items(fs,d){const out=[];for(const f of fs){if(f.type==='h'||!visible(f,d))continue;const v=d[f.k];
 if(f.type==='rep'){out.push({domanda:f.l,risposta:(v||[]).map(it=>items(f.f,it||{}))});continue}
 const lab=f.type==='stato'&&f.custom?(v&&v.label)||f.l:f.l;
 const o={domanda:lab,risposta:fmt(f,v)||null};const n=d[f.k+'_note'];if(n)o.note=n;out.push(o)}return out}
function struct(r){const m=MOD[r.tipo];return{modulo:m.nome,sigla:m.sigla,stato:r.stato||'bozza',aggiornato:r.aggiornato,sezioni:m.sez.map(s=>({sezione:s.t,voci:items(s.f,r.d)}))}}
function lines(vs,ind){let t='';for(const v of vs){if(Array.isArray(v.risposta)){t+=ind+v.domanda+': '+(v.risposta.length?'':'nessuna voce')+'\n';v.risposta.forEach((it,i)=>{t+=ind+'  '+(i+1)+')\n'+lines(it,ind+'     ')})}else t+=ind+v.domanda+': '+(v.risposta??'—')+(v.note?' [note: '+v.note+']':'')+'\n'}return t}
